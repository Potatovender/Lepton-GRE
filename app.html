<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lepton GRE App</title>
    <meta
      name="description"
      content="Launch the Lepton-GRE mathematical grid renderer and function visualizer."
    />
    <link rel="icon" href="./src/assets/lepton-favicon.png?v=20260909-editor-context" type="image/png" />
    <link rel="shortcut icon" href="./src/assets/lepton-favicon.png?v=20260909-editor-context" type="image/png" />
    <link rel="apple-touch-icon" href="./src/assets/lepton-favicon.png?v=20260909-editor-context" />
    <link rel="stylesheet" href="./src/libs/mathquill/style.css" />
    <link rel="stylesheet" href="./src/styles.css?v=20260909-editor-context" />
  </head>
  <body>
    <div id="app">
      <main class="app-shell">
        <section class="expression-panel" aria-label="Expression editor">
          <header class="panel-header">
            <div class="brand-row">
              <a class="brand-link" href="./index.html" aria-label="Go to Lepton landing page">
                <img src="./src/assets/lepton-logo-transparent.png" alt="" />
                <strong>Lepton GRE</strong>
              </a>
              <span class="loading-note">Loading editor...</span>
            </div>
          </header>
          <noscript>Lepton needs JavaScript enabled to edit and render graphs.</noscript>
        </section>
        <div class="sidebar-resizer" aria-hidden="true"></div>
        <section class="renderer-pane" aria-label="Grid renderer">
          <canvas class="grid-canvas"></canvas>
          <div class="render-overlay" role="status">Loading Lepton...</div>
        </section>
      </main>
    </div>
    <script src="./src/libs/mathquill/index.global.js"></script>
    <script type="module" src="./src/browser-preview-live.js?v=20260909-editor-context"></script>
  </body>
</html>
